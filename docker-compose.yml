services:
  postgres:
    image: postgres:16-alpine
    container_name: valleystore-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valleystore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-valleystore}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - valleystore-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valleystore-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-valleystore}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a secure random value of at least 32 bytes}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - valleystore-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valleystore-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - valleystore-network

volumes:
  pgdata:

networks:
  valleystore-network:
    driver: bridge